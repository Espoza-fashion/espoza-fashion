<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espoza Fashion | متجر الأزياء النسائية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #121212;
      --accent: #d4af37;
      --accent-hover: #b59228;
      --text: #ffffff;
      --muted: #a3a3a3;
      --border: #222222;
      --radius: 14px;
      --shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* BAR NOTICE */
    .top-bar {
      background: linear-gradient(90deg, #111, var(--accent), #111);
      color: #000;
      font-weight: 700;
      text-align: center;
      padding: 6px 10px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    /* HEADER */
    header {
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-top: -4px;
      letter-spacing: 2px;
    }

    /* FILTERS */
    .nav-filters {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: #0d0d0d;
      scrollbar-width: none;
    }
    .nav-filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 20px;
      border-radius: 30px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* CONTAINER & GRID */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    /* PRODUCT CARD */
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: var(--shadow);
    }

    .product-img-wrapper {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 3/4;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-img {
      transform: scale(1.05);
    }

    .badge-colors {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      color: var(--accent);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .product-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .product-price {
      color: var(--accent);
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: background 0.3s ease;
      font-size: 14px;
    }

    .btn:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #444;
    }

    /* MODAL STYLES */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      box-shadow: var(--shadow);
    }

    .close-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }

    .thumbs-container {
      display: flex;
      gap: 10px;
      margin: 14px 0;
    }

    .thumb-img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    .thumb-img.active, .thumb-img:hover {
      border-color: var(--accent);
      opacity: 1;
    }

    .sizes-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .size-option {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s ease;
    }

    .size-option.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="top-bar">توصيل سريع لكافة مناطق القدس، الضفة، والداخل 🌸</div>

  <header>
    <div>
      <div class="logo">Espoza</div>
      <span class="brand-sub">FASHION DESIGN</span>
    </div>
  </header>

  <div class="nav-filters">
    <button class="filter-btn active" onclick="setCategory('all', this)">كل المجموعات</button>
    <button class="filter-btn" onclick="setCategory('dresses', this)">أطقم وفساتين</button>
    <button class="filter-btn" onclick="setCategory('abayas', this)">عبايات</button>
    <button class="filter-btn" onclick="setCategory('evening', this)">فساتين سهرة</button>
  </div>

  <main class="container">
    <div class="grid" id="productsGrid"></div>
  </main>

  <!-- DETAIL MODAL -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
      <img id="detailImage" src="" alt="Product" style="width:100%; height:380px; object-fit:cover; border-radius:10px;">
      <div class="thumbs-container" id="detailThumbs"></div>
      <h2 id="detailTitle" style="margin-top:12px; font-size:20px;"></h2>
      <p id="detailPrice" style="color:var(--accent); font-size:22px; font-weight:800; margin-bottom:12px;"></p>
      
      <div style="margin:16px 0;">
        <p style="color:var(--muted); font-size:13px; margin-bottom:8px;">المقاسات المتوفرة:</p>
        <div class="sizes-wrap" id="detailSizes"></div>
      </div>

      <p id="detailDescription" style="color:var(--muted); font-size:14px; margin-bottom:24px; line-height:1.6;"></p>
      <button class="btn" onclick="orderFromDetail()">طلب القطعة الان</button>
    </div>
  </div>

  <!-- ORDER MODAL -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('orderModal')">&times;</button>
      <h3 style="font-size:18px; margin-bottom:15px;">إتمام الطلب المباشر</h3>
      <form onsubmit="submitOrder(event)">
        <div style="display:flex; gap:12px; align-items:center; margin-bottom:18px; background:var(--bg); padding:12px; border-radius:10px; border:1px solid var(--border);">
          <img id="orderImage" src="" style="width:70px; height:70px; object-fit:cover; border-radius:8px;">
          <div>
            <h4 id="orderProductName" style="font-size:15px; color:#fff;"></h4>
            <span id="orderProductPrice" style="color:var(--accent); font-weight:bold; font-size:16px;"></span>
          </div>
        </div>

        <div class="form-group" id="colorGroup">
          <label>اللون المطلوبة:</label>
          <select id="orderColor"></select>
        </div>

        <div class="form-group">
          <label>المقاس المطلوب:</label>
          <select id="orderSize"></select>
        </div>

        <div class="form-group">
          <label>الاسم الكامل:</label>
          <input type="text" id="customerName" required placeholder="أدخلي اسمك الكامل">
        </div>

        <div class="form-group">
          <label>رقم الهاتف للتواصل:</label>
          <input type="tel" id="customerPhone" required placeholder="05XXXXXXXX">
        </div>

        <div class="form-group">
          <label>منطقة التوصيل:</label>
          <select id="deliveryRegion" onchange="updateDelivery()">
            <option value="westbank">الضفة الغربية (20 ₪)</option>
            <option value="jerusalem">القدس (30 ₪)</option>
            <option value="inside">الداخل / 48 (70 ₪)</option>
          </select>
        </div>

        <div class="form-group">
          <label>المدينة / القرية:</label>
          <input type="text" id="customerCity" required placeholder="اسم المدينة أو القرية">
        </div>

        <div class="form-group">
          <label>العنوان التفصيلي:</label>
          <input type="text" id="customerAddress" required placeholder="اسم الشارع، معلم قريب...">
        </div>

        <div style="display:flex; justify-content:space-between; margin:20px 0; font-weight:bold; font-size:16px; border-top:1px dashed var(--border); padding-top:15px;">
          <span>المجموع الإجمالي مع التوصيل:</span>
          <span id="orderTotal" style="color:var(--accent); font-size:18px;"></span>
        </div>

        <button type="submit" class="btn" style="padding:14px;">إرسال الطلب عبر WhatsApp</button>
      </form>
    </div>
  </div>

  <script>
    /* دالة توليد المقاسات الزوجية تلقائياً */
    function generateSizes(min, max) {
      let list = [];
      for (let i = min; i <= max; i += 2) {
        list.push(i.toString());
      }
      return list;
    }

    /* =========================================================
       قائمة منتجات ESPOZA FASHION
       ========================================================= */
    const products = [
      {
        id: 1,
        name: "طقم كاميل الفاخر",
        category: "dresses",
        price: 260,
        sizes: generateSizes(42, 52),
        description: "طقم أنيق باللون الكاميل المميز بتصميم عصري وخامة راقية توفر الراحة والأناقة.",
        colors: [
          { name: "كاميل", image: "IMG_3475.jpeg" }
        ]
      },
      {
        id: 2,
        name: "طقم ريم",
        category: "dresses",
        price: 220,
        sizes: generateSizes(44, 54),
        description: "طقم قطعتين راقي بتصميم مميز وخامة مريحة تمنحك إطلالة متألقة وعصرية.",
        colors: [
          { name: "اللون الأساسي", image: "IMG_3476.jpeg" }
        ]
      },
      {
        id: 3,
        name: "طقم لارين",
        category: "dresses",
        price: 240,
        sizes: generateSizes(42, 52),
        description: "طقم قطعتين راقي بتصميم عصري مميز يمنحك إطلالة متألقة ومريحة.",
        colors: [
          { name: "اللون الأساسي", image: "Publer-1784112092182.jpeg" }
        ]
      },
      {
        id: 4,
        name: "طقم سيلا",
        category: "dresses",
        price: 230,
        sizes: generateSizes(42, 52),
        description: "طقم قطعتين راقي ومتوفر بلونين مميزين (أسود وكحلي) بتصميم عصري وأنيق.",
        colors: [
          { name: "أسود", image: "345F35AC-5CC0-495B-A68A-5EAA066C6448.jpeg" },
          { name: "كحلي", image: "A5E07FC2-DED5-4FC4-ABF9-F318EB74CBA9.jpeg" }
        ]
      }
    ];

    let currentCategory = 'all';
    let selectedProduct = null;
    let selectedColorIndex = 0;
    let selectedSize = '';

    function money(amount) {
      return amount + " ₪";
    }

    function getMainImage(product, colorIdx = 0) {
      if (product.colors && product.colors[colorIdx] && product.colors[colorIdx].image) {
        return product.colors[colorIdx].image;
      }
      return "https://via.placeholder.com/400x600?text=Espoza";
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";

      const filtered = currentCategory === 'all' 
        ? products 
        : products.filter(p => p.category === currentCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 50px 0;">لا توجد منتجات في هذا القسم حالياً.</p>`;
        return;
      }

      filtered.forEach(p => {
        const colorBadge = p.colors && p.colors.length > 1 ? `<span class="badge-colors">${p.colors.length} ألوان</span>` : '';
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="product-img-wrapper" onclick="openDetail(${p.id})">
            ${colorBadge}
            <img src="${getMainImage(p)}" class="product-img" alt="${p.name}">
          </div>
          <div class="product-info">
            <div class="product-title" onclick="openDetail(${p.id})">${p.name}</div>
            <div class="product-price">${money(p.price)}</div>
            <div class="btn-group">
              <button class="btn btn-secondary" onclick="openDetail(${p.id})">التفاصيل</button>
              <button class="btn" onclick="openOrder(${p.id})">طلب سريع</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function openDetail(id) {
      selectedProduct = products.find(p => p.id === id);
      if (!selectedProduct) return;

      selectedColorIndex = 0;
      selectedSize = selectedProduct.sizes && selectedProduct.sizes.length ? selectedProduct.sizes[0] : "حسب التوفر";

      updateDetails();
      document.getElementById("detailModal").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function updateDetails() {
      const p = selectedProduct;
      document.getElementById("detailImage").src = getMainImage(p, selectedColorIndex);
      document.getElementById("detailTitle").textContent = p.name;
      document.getElementById("detailPrice").textContent = money(p.price);

      const thumbs = document.getElementById("detailThumbs");
      thumbs.innerHTML = "";
      if (p.colors && p.colors.length > 1) {
        p.colors.forEach((col, idx) => {
          const img = document.createElement("img");
          img.src = col.image;
          img.className = "thumb-img" + (idx === selectedColorIndex ? " active" : "");
          img.onclick = () => {
            selectedColorIndex = idx;
            updateDetails();
          };
          thumbs.appendChild(img);
        });
      }

      const sizes = document.getElementById("detailSizes");
      sizes.innerHTML = "";
      if (p.sizes && p.sizes.length) {
        p.sizes.forEach(s => {
          const btn = document.createElement("button");
          btn.className = "size-option" + (s === selectedSize ? " active" : "");
          btn.textContent = s;
          btn.onclick = () => {
            selectedSize = s;
            updateDetails();
          };
          sizes.appendChild(btn);
        });
      }

      document.getElementById("detailDescription").textContent = p.description || "قطعة مميزة من مجموعة Espoza Fashion Design.";
    }

    function openOrder(id) {
      closeModal('detailModal');
      selectedProduct = products.find(p => p.id === id);
      if (!selectedProduct) return;

      selectedColorIndex = 0;
      selectedSize = selectedProduct.sizes && selectedProduct.sizes.length ? selectedProduct.sizes[0] : "حسب التوفر";

      document.getElementById("orderImage").src = getMainImage(selectedProduct, selectedColorIndex);
      document.getElementById("orderProductName").textContent = selectedProduct.name;
      document.getElementById("orderProductPrice").textContent = money(selectedProduct.price);

      const orderColorSelect = document.getElementById("orderColor");
      const colorGroup = document.getElementById("colorGroup");
      orderColorSelect.innerHTML = "";

      if (selectedProduct.colors && selectedProduct.colors.length) {
        colorGroup.style.display = "block";
        selectedProduct.colors.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.name;
          opt.textContent = c.name;
          orderColorSelect.appendChild(opt);
        });
      } else {
        colorGroup.style.display = "none";
      }

      const orderSizeSelect = document.getElementById("orderSize");
      orderSizeSelect.innerHTML = "";
      if (selectedProduct.sizes && selectedProduct.sizes.length) {
        selectedProduct.sizes.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          orderSizeSelect.appendChild(opt);
        });
      }

      updateDelivery();
      document.getElementById("orderModal").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function orderFromDetail() {
      if (selectedProduct) openOrder(selectedProduct.id);
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
      document.body.style.overflow = "auto";
    }

    function updateDelivery() {
      if (!selectedProduct) return;
      const region = document.getElementById("deliveryRegion").value;
      let fee = 20;

      if (region === "jerusalem") fee = 30;
      else if (region === "inside") fee = 70;

      const total = selectedProduct.price + fee;
      document.getElementById("orderTotal").textContent = money(total);
    }

    function submitOrder(e) {
      e.preventDefault();

      const name = document.getElementById("customerName").value.trim();
      const phone = document.getElementById("customerPhone").value.trim();
      const regionSelect = document.getElementById("deliveryRegion");
      const regionText = regionSelect.options[regionSelect.selectedIndex].text;
      const city = document.getElementById("customerCity").value.trim();
      const address = document.getElementById("customerAddress").value.trim();
      const size = document.getElementById("orderSize").value;
      
      const orderColorSelect = document.getElementById("orderColor");
      const color = (selectedProduct.colors && selectedProduct.colors.length && orderColorSelect.value) 
        ? orderColorSelect.value 
        : "اللون الأساسي";

      const totalText = document.getElementById("orderTotal").textContent;

      const text = `طلب جديد من موقع Espoza Fashion 🌸\n\n` +
        `*اسم المنتج:* ${selectedProduct.name}\n` +
        `*اللون:* ${color}\n` +
        `*المقاس:* ${size}\n` +
        `*السعر:* ${money(selectedProduct.price)}\n\n` +
        `---\n` +
        `*معلومات الزبونة:*\n` +
        `*الاسم:* ${name}\n` +
        `*رقم الهاتف:* ${phone}\n` +
        `*المنطقة:* ${regionText}\n` +
        `*المدينة/القرية:* ${city}\n` +
        `*العنوان:* ${address}\n\n` +
        `*المبلغ الإجمالي مع التوصيل:* ${totalText}`;

      window.open(`https://wa.me/972595461861?text=${encodeURIComponent(text)}`, "_blank");
    }

    renderProducts();
  </script>
</body>
</html>
